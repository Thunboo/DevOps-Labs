data_dir: /vector-data

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  docker:
    type: docker_logs

  host_logs:
    type: file
    include:
      - /var/log/*.log
      - /var/log/secure
      - /var/log/syslog
      - /var/log/messages
    read_from: beginning

  # Example for adding more VPS/application logs:
  #
  # app_logs:
  #   type: file
  #   include:
  #     - /opt/myapp/logs/*.log
  #   read_from: end

  vector_metrics:
    type: internal_metrics

transforms:
  docker_msg_parser:
    type: remap
    inputs: [docker]
    source: |
      .message = parse_json(.message) ?? .message

  host_log_normalizer:
    type: remap
    inputs: [host_logs]
    source: |
      .source_type = "host_file"
      .log_file = to_string(.file) ?? "unknown"

sinks:
  logs_to_victorialogs:
    type: elasticsearch
    inputs: [docker_msg_parser, host_log_normalizer]
    endpoints: [http://victorialogs:9428/insert/elasticsearch/]
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    request:
      headers:
        VL-Stream-Fields: source_type,label.com.docker.compose.service,container_name,log_file,host
        VL-Time-Field: timestamp
        VL-Msg-Field: message,msg,_msg,message.message,message.log
        AccountID: "0"
        ProjectID: "0"

  vector_metrics_exporter:
    type: prometheus_exporter
    inputs: [vector_metrics]
    address: 0.0.0.0:9598
