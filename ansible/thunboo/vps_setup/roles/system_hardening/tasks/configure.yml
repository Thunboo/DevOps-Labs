---
# SSH, Fail2Ban, nginx
- name: Configure ssh
  block:
    - name: Configure SSH hardening
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          Port {{ ssh_port }}

          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AllowUsers {{ ssh_allowed_users | join(' ') }}

          ClientAliveInterval 450
          ClientAliveCountMax 2

          HostbasedAuthentication no
          IgnoreRhosts yes
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Reload SSH

# TODO: Later make it user-friendly, so everyone can customise it
- name: Configure login banners
  block:
    - name: Add login issue banner
      ansible.builtin.copy:
        src: etc/issue
        dest: /etc/issue
        owner: root
        group: root
        mode: "0644"

    - name: Add dynamic message of the day
      ansible.builtin.copy:
        src: etc/update-motd.d/99-thunboo
        dest: /etc/update-motd.d/99-thunboo
        owner: root
        group: root
        mode: "0755"
      notify: Update dynamic MOTD

- name: Configure UFW
  block:
    - name: Set default incoming policy
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set default outgoing policy
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

- name: Configure Fail2Ban
  block:
    - name: Configure Fail2Ban for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          port = {{ ssh_port }}
          backend = systemd
          maxretry = 5
          findtime = 10m
          bantime = 1h
      notify: Restart Fail2Ban

    - name: Enable Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

- name: Configure nginx
  when: system_hardening_configure_nginx | bool else false
  block:
    - name: Copy nginx main config
      ansible.builtin.template:
        src: nginx/nginx.conf.j2
        dest: "/etc/nginx/nginx.conf"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Copy nginx stream config
      ansible.builtin.template:
        src: nginx/default.stream.j2
        dest: "/etc/nginx/stream-enabled/default.conf"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Test nginx config
      ansible.builtin.command: nginx -t
      changed_when: false
      become: true
