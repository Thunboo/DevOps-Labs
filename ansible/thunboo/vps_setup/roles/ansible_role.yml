---
# Vars for the nginxinc.nginx_config role.
# Usage: include this file as vars for the nginxinc.nginx_config role.

nginx_config_cleanup: false
nginx_config_upload_enable: false

nginx_config_main_template_enable: true
nginx_config_main_template:
  template_file: nginx.conf.j2
  deployment_location: /etc/nginx/nginx.conf
  config:
    main:
      user:
        username: www-data
      worker_processes: auto
      pid: /run/nginx.pid
      error_log: /var/log/nginx/error.log
    include:
      - /etc/nginx/modules-enabled/*.conf
    events:
      worker_connections: 768
    http:
      include:
        - /etc/nginx/mime.types
        - /etc/nginx/conf.d/*.conf
        - /etc/nginx/sites-enabled/*
    stream:
      include:
        - /etc/nginx/stream-enabled/*

nginx_config_http_template_enable: true
nginx_config_http_template:
  - template_file: http/default.conf.j2
    deployment_location: /etc/nginx/conf.d/00-http-defaults.conf
    config:
      core:
        sendfile: true
        tcp_nopush: true
        types_hash_max_size: 2048
        default_type: application/octet-stream
      ssl:
        protocols:
          - TLSv1
          - TLSv1.1
          - TLSv1.2
          - TLSv1.3
        prefer_server_ciphers: true
      log:
        access:
          - path: /var/log/nginx/access.log
      gzip:
        enable: true

  - template_file: http/default.conf.j2
    deployment_location: /etc/nginx/sites-enabled/netbird
    config:
      upstreams:
        - name: netbird_dashboard
          servers:
            - address: 127.0.0.1:8080
          keepalive: 10
        - name: netbird_server
          servers:
            - address: 127.0.0.1:8081
      servers:
        - core:
            server_name:
              - netbird.thunboo.ru
            client_header_timeout: 1d
            client_body_timeout: 1d
          custom_directives:
            - listen 127.0.0.1:8443 ssl http2;
          ssl:
            certificate:
              - /etc/letsencrypt/live/netbird.thunboo.ru/fullchain.pem
              - /etc/ssl/certs/thunboo.ru.crt
            certificate_key:
              - /etc/letsencrypt/live/netbird.thunboo.ru/privkey.pem
              - /etc/ssl/private/thunboo.ru.key
          proxy:
            set_header:
              - field: X-Real-IP
                value: $remote_addr
              - field: X-Forwarded-For
                value: $proxy_add_x_forwarded_for
              - field: X-Scheme
                value: $scheme
              - field: X-Forwarded-Proto
                value: https
              - field: X-Forwarded-Host
                value: $host
          grpc:
            set_header:
              - field: X-Forwarded-For
                value: $proxy_add_x_forwarded_for
          locations:
            - location: '~ ^/(relay|ws-proxy/)'
              proxy:
                pass: http://netbird_server
                http_version: 1.1
                set_header:
                  - field: Upgrade
                    value: $http_upgrade
                  - field: Connection
                    value: '"Upgrade"'
                  - field: Host
                    value: $host
                read_timeout: 1d
            - location: '~ ^/(signalexchange\.SignalExchange|management\.ManagementService)/'
              grpc:
                pass: grpc://netbird_server
                read_timeout: 1d
                send_timeout: 1d
                socket_keepalive: true
            - location: '~ ^/(api|oauth2)/'
              proxy:
                pass: http://netbird_server
                set_header:
                  - field: Host
                    value: $host
            - location: /
              proxy:
                pass: http://netbird_dashboard

  - template_file: http/default.conf.j2
    deployment_location: /etc/nginx/sites-enabled/grafana
    config:
      servers:
        - core:
            listen:
              - address: 127.0.0.1
                port: 8443
                ssl: true
            server_name:
              - grafana.thunboo.ru
          ssl:
            certificate: /etc/letsencrypt/live/grafana.thunboo.ru/fullchain.pem
            certificate_key: /etc/letsencrypt/live/grafana.thunboo.ru/privkey.pem
          locations:
            - location: /
              proxy:
                pass: http://100.97.243.158:3000
                http_version: 1.1
                set_header:
                  - field: Host
                    value: $host
                  - field: X-Real-IP
                    value: $remote_addr
                  - field: X-Forwarded-For
                    value: $proxy_add_x_forwarded_for
                  - field: X-Forwarded-Proto
                    value: https
                  - field: Upgrade
                    value: $http_upgrade
                  - field: Connection
                    value: '"upgrade"'

nginx_config_stream_template_enable: true
nginx_config_stream_template:
  - template_file: stream/default.conf.j2
    deployment_location: /etc/nginx/stream-enabled/default
    config:
      upstreams:
        - name: mtproto
          servers:
            - address: 127.0.0.1:8446
        - name: https_sites
          servers:
            - address: 127.0.0.1:8443
      custom_directives:
        - map $ssl_preread_server_name $sni_name {
        - "    hostnames;"
        - "    thunboo.ru mtproto;"
        - "    grafana.thunboo.ru https_sites;"
        - "    netbird.thunboo.ru https_sites;"
        - "    default mtproto;"
        - "}"
      servers:
        - core:
            listen:
              - port: 443
          custom_directives:
            - ssl_preread on;
            - proxy_pass $sni_name;
            - set_real_ip_from unix:;
