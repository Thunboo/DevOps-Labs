# ...
- name: Configure ssh
  block:
    - name: Configure SSH hardening
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart SSH

- name: Configure UFW
  block:
    - name: Set default incoming policy
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set default outgoing policy
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port | default(22) }}"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # TODO: Эта штука должна быть более комплексной. Суть в том, что по-хорошему - порты для этого: все порты из докер компоузов + ссш + 80 + 443
